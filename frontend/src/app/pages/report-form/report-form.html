<div class="page"><mat-card><mat-card-title>Reportar corte de energía</mat-card-title><mat-card-content><mat-form-field appearance="outline"><mat-label>Zona</mat-label><mat-select [(ngModel)]="zonaId">@for(z of zones;track z.id){<mat-option [value]="z.id">{{z.nombre}}</mat-option>}</mat-select></mat-form-field><mat-form-field appearance="outline"><mat-label>Dirección</mat-label><input matInput [(ngModel)]="direccion"></mat-form-field><mat-form-field appearance="outline"><mat-label>Hora de inicio</mat-label><input matInput type="datetime-local" [(ngModel)]="horaInicio"></mat-form-field><label>Foto de evidencia</label><input type="file" accept="image/*" (change)="selectFile($event)">@if(error){<p class="error">{{error}}</p>}</mat-card-content><mat-card-actions><button mat-raised-button color="primary" (click)="submit()" [disabled]="loading">{{loading?'Guardando...':'Enviar reporte'}}</button><button mat-button (click)="cancel()">Cancelar</button></mat-card-actions></mat-card></div>
