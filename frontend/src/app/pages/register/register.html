<div class="register-container"><mat-card><mat-card-header><mat-card-title>Crear cuenta ciudadana</mat-card-title></mat-card-header><mat-card-content><mat-form-field appearance="outline"><mat-label>Nombre completo</mat-label><input matInput [(ngModel)]="fullName"></mat-form-field><mat-form-field appearance="outline"><mat-label>Usuario</mat-label><input matInput [(ngModel)]="username"></mat-form-field><mat-form-field appearance="outline"><mat-label>Email</mat-label><input matInput type="email" [(ngModel)]="email"></mat-form-field><mat-form-field appearance="outline"><mat-label>Contraseña</mat-label><input matInput type="password" [(ngModel)]="password"></mat-form-field><mat-form-field appearance="outline"><mat-label>Teléfono</mat-label><input matInput [(ngModel)]="phoneNumber"></mat-form-field><mat-form-field appearance="outline"><mat-label>Fecha de nacimiento</mat-label><input matInput type="date" [(ngModel)]="birthDate"></mat-form-field>@if(errorMessage){<p class="error">{{errorMessage}}</p>}</mat-card-content><mat-card-actions><button mat-raised-button color="primary" (click)="onRegister()" [disabled]="isLoading">{{isLoading?'Creando...':'Registrarse'}}</button><a routerLink="/login">Ya tengo cuenta</a></mat-card-actions></mat-card></div>
