<div class="page"><h1>Panel del técnico</h1>@if(reports.length===0){<p>No hay reportes asignados.</p>}@for(r of reports;track r.id){<mat-card><h2>{{r.direccion}}</h2><p>Estado: {{r.estado}}</p><mat-form-field appearance="outline"><mat-label>Causa</mat-label><input matInput [(ngModel)]="cause"></mat-form-field><mat-form-field appearance="outline"><mat-label>Hora de restablecimiento</mat-label><input matInput type="datetime-local" [(ngModel)]="hora"></mat-form-field><mat-form-field appearance="outline"><mat-label>Detalle</mat-label><textarea matInput [(ngModel)]="detail"></textarea></mat-form-field><button mat-raised-button color="primary" (click)="resolve(r)">Marcar como resuelto</button></mat-card> }</div>
