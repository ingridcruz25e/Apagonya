<div class="login-container"><mat-card><mat-card-header><mat-card-title>⚡ ApagónYa</mat-card-title></mat-card-header><mat-card-content><mat-form-field appearance="outline"><mat-label>Email</mat-label><input matInput type="email" [(ngModel)]="email"></mat-form-field><mat-form-field appearance="outline"><mat-label>Contraseña</mat-label><input matInput type="password" [(ngModel)]="password"></mat-form-field>@if(errorMessage){<p class="error">{{errorMessage}}</p>}</mat-card-content><mat-card-actions><button mat-raised-button color="primary" (click)="onLogin()" [disabled]="isLoading">{{isLoading?'Entrando...':'Iniciar sesión'}}</button><a routerLink="/register">Crear cuenta</a></mat-card-actions></mat-card></div>
